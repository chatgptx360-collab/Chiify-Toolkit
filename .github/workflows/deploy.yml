name: Deploy to GitHub Pages

# Publishing runs on GitHub's runners rather than anywhere else, which is what
# lets the whole thing work from a push: the build has network access, the
# artifact never leaves GitHub, and no deployment token has to exist.
on:
  push:
    branches:
      - main
  # So a deployment can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Required by actions/deploy-pages: it authenticates to Pages with a
  # short-lived OIDC token instead of a stored secret.
  id-token: write

# Deployments queue rather than cancel each other. A cancelled deploy can leave
# the site mid-update, and the site is the artifact of record.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate that runs locally: typecheck, lint, format and 156 tests.
      # A deploy that publishes a broken build is worse than one that fails, and
      # this is the only place the checks run automatically — there is
      # deliberately no pull-request workflow.
      - name: Verify
        run: npm run verify

      # Pages has to be switched on for the repository once, by hand, before any
      # of this can run. That is not an oversight in this workflow: creating a
      # Pages site is an administrative action, and the automatic GITHUB_TOKEN
      # deliberately cannot perform one. `pages: write` grants the right to
      # publish to a site that exists, not to create it.
      #
      # Without this check the failure is "Resource not accessible by
      # integration", which names neither the cause nor the fix.
      - name: Check Pages is enabled
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$status" = "404" ]; then
            echo "::error title=GitHub Pages is not enabled::Open Settings → Pages, set Source to 'GitHub Actions', then re-run this workflow. It is a one-time step: a workflow token is not permitted to create a Pages site."
            exit 1
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # A project site is served from a subdirectory, so every asset URL has to
      # carry it. `base_path` comes from the step above rather than being
      # written here, which keeps this correct if the repository is renamed.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

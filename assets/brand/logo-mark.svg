<!--
  Chiify Toolkit — logo mark (design source).

  This is the master artwork. It is NOT served: components render the mark from
  inline JSX in components/common/logo.tsx so it inherits `currentColor` and
  costs no extra request. Keep the two in sync — this file is the reference an
  external designer or a print asset would be produced from.

  Geometry: an open book formed from two page curves meeting at a spine.
  Drawn on a 24×24 grid with a 2px stroke to match the Lucide icon set.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M12 6.5C10.4 4.9 8.3 4 6 4H3v14h3c2.3 0 4.4.9 6 2.5" />
    <path d="M12 6.5C13.6 4.9 15.7 4 18 4h3v14h-3c-2.3 0-4.4.9-6 2.5" />
    <path d="M12 6.5v14" />
  </g>
</svg>
